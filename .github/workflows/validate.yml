name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    # HACS validates the GitHub copy exactly as HACS serves it (latest release
    # for repos that use releases). The Gitea origin also picks up this file,
    # so guard to GitHub-only (server URL AND repo path): on Gitea the job
    # skips instead of validating the wrong context.
    if: github.server_url == 'https://github.com' && github.repository == 'qazmoe/ha_nicehash'
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # nicehash has no assets in home-assistant/brands yet. Long-term
          # fix: contribute icons to the brands repo, then remove this ignore.
          ignore: brands

  hassfest:
    # Home Assistant integration structure validation (recommended alongside
    # the HACS action by the HACS docs)
    if: github.server_url == 'https://github.com' && github.repository == 'qazmoe/ha_nicehash'
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out code
        uses: "actions/checkout@v7"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
